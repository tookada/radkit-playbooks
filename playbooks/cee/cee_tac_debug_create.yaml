name: cee_tac_debug_create
description: Create new Cloud-Native 5G CEE (SMF / UPF / PCF) TAC debug package, poll status, merge, and extract via Kubernetes
group: Diagnostics
continue_on_error: false

effort:
  manual_minutes: 45
  per_node_minutes: 0

variables:
  cee_node:
    type: string
    required: true
    description: RADKit device name for CEE Ops-Center CLI (e.g. cee-01)
  time_window:
    type: string
    required: true
    description: "Debug window (e.g. 'last 2h' or 'from 2026-10-01_10:00:00 to 2026-10-01_10:15:00')"
  k8s_node:
    type: string
    required: false
    default: ""
    description: "Optional override for K8s Master host (auto-discovered from CEE if omitted)"

commands:
  # =========================================================================
  # 1. Discover Kubernetes Master Host IP from CEE Configuration
  # =========================================================================
  - id: discover_k8s_host
    target: "{{ variables.cee_node }}"
    command: show running-config k8s ingress-host-name
    fail_on_cli_error: true
    description: Query active Kubernetes host ingress IP address from CEE configuration
    capture:
      k8s_ip:
        regex: '(?P<value>(?:\d{1,3}\.){3}\d{1,3})'
        match: first
        required: true

  # =========================================================================
  # 2. FAIL-FAST CHECK: Verify K8s Master Inventory & Reachability Early
  # =========================================================================
  - id: verify_k8s_node
    target: "{{ variables.k8s_node or steps.discover_k8s_host.k8s_ip }}"
    command: "echo 'K8s Master connectivity verified on ' $(hostname)"
    fail_on_cli_error: true
    description: Confirm K8s master node exists in inventory and is reachable before starting collection

  # =========================================================================
  # 3. Wait for Any Concurrent TAC Debug Session to Complete
  # =========================================================================
  - id: wait_for_idle_session
    target: "{{ variables.cee_node }}"
    command: tac-debug-pkg status
    fail_on_cli_error: true
    description: Wait for any existing TAC debug collection to finish before starting a new one
    poll:
      until_pattern: "No active tac debug session"
      interval: 15
      timeout: 600

  # =========================================================================
  # 4. Initiate Asynchronous TAC Debug Package Generation on CEE
  # =========================================================================
  - id: create_debug_pkg
    target: "{{ variables.cee_node }}"
    command: "tac-debug-pkg create {{ variables.time_window }}"
    fail_on_cli_error: true
    description: Trigger background diagnostic log collection across microservices
    capture:
      tac_id:
        regex: '(?i)(?:tac-debug\s+pkg\s+ID|id)\s*[:=]\s*(?P<value>\d+)'
        match: first
        required: true

  # =========================================================================
  # 5. Poll CEE Status Until Microservice Gathering Completes
  # =========================================================================
  - id: wait_debug_ready
    target: "{{ variables.cee_node }}"
    command: tac-debug-pkg status
    fail_on_cli_error: true
    description: Periodically check CEE status until all microservices finish writing logs
    poll:
      until_pattern: "No active tac debug session"
      interval: 10
      timeout: 900

  # =========================================================================
  # 6. Verify Generated Debug Package in CEE List
  # =========================================================================
  - id: verify_debug_pkg
    target: "{{ variables.cee_node }}"
    command: tac-debug-pkg list
    fail_on_cli_error: true
    description: Verify that the generated TAC ID is recorded in the available packages inventory
    fail_on_validation: true
    capture:
      pkg_list:
        regex: '(?P<value>[\s\S]+)'
        match: first
        required: true
    validations:
      - name: generated_tac_id_exists
        source: captures.pkg_list
        condition: contains
        expected: "{{ steps.create_debug_pkg.tac_id }}"

  # =========================================================================
  # 7. Merge Debug Package into Tarball inside Pod
  # =========================================================================
  - id: merge_debug_pkg
    target: "{{ variables.cee_node }}"
    command: "tac-debug-pkg merge tac-id {{ steps.create_debug_pkg.tac_id }}"
    fail_on_cli_error: true
    description: Assemble and package microservice logs into a single tarball
    timeout: 1800

  # =========================================================================
  # 8. Dynamically Discover show-tac-manager Namespace and Pod on K8s Node
  # =========================================================================
  - id: discover_tac_pod
    target: "{{ variables.k8s_node or steps.discover_k8s_host.k8s_ip }}"
    command: "kubectl get pods -A | grep show-tac-manager | head -n 1"
    fail_on_cli_error: true
    description: Resolve active Kubernetes namespace and show-tac-manager pod without hardcoding
    capture:
      namespace:
        regex: '(?m)^(?P<value>[a-zA-Z0-9_\-]+)\s+\S*show-tac-manager\S*'
        match: first
        required: true
      pod_name:
        regex: '(?m)^\S+\s+(?P<value>\S*show-tac-manager\S*)'
        match: first
        required: true

  # =========================================================================
  # 9. Extract Tarball from Container to Host & Download via SFTP
  # =========================================================================
  - id: extract_and_download_tac_pkg
    target: "{{ variables.k8s_node or steps.discover_k8s_host.k8s_ip }}"
    type: file_capture
    command: "umask 077 && kubectl cp -n {{ steps.discover_tac_pod.namespace }} -c show-tac-manager {{ steps.discover_tac_pod.pod_name }}:/home/tac/{{ steps.create_debug_pkg.tac_id }}/tac_debug_pkg_{{ steps.create_debug_pkg.tac_id }}.tar /tmp/{{ variables.cee_node }}_{{ steps.create_debug_pkg.tac_id }}.tar && chmod 600 /tmp/{{ variables.cee_node }}_{{ steps.create_debug_pkg.tac_id }}.tar && echo 'Archive extracted: /tmp/{{ variables.cee_node }}_{{ steps.create_debug_pkg.tac_id }}.tar'"
    fail_on_cli_error: true
    description: Extract tar archive from pod to K8s host /tmp and download to local disk
    continue_on_error: false
    capture:
      archive_path:
        regex: '(?m)^[ \t]*Archive extracted:[ \t]+(?P<value>/tmp/\S+\.tar)[ \t]*\r?$'
        required: true
    generated_path:
      path: "/tmp/{{ variables.cee_node }}_{{ steps.create_debug_pkg.tac_id }}.tar"
      regex: 'Archive extracted:\s*(\S+\.tar|\/tmp\/\S+\.tar)'
    cleanup: "rm -f {{ remote_file_path }}"
    timeout: 1800

  - id: cleanup_cee_pkg
    target: "{{ variables.cee_node }}"
    command: "tac-debug-pkg delete tac-id {{ steps.create_debug_pkg.tac_id }}"
    fail_on_cli_error: true
    description: Purge debug session from CEE to reclaim container storage only after successful download
    requires_step: extract_and_download_tac_pkg
