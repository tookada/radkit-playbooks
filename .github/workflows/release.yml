name: Release YAML collection

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_playbooks.py
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.build_release
      - name: Verify archive checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_NOTES: |
            Download radkit-playbooks.zip for the YAML-only collection.
            SHA256SUMS provides its SHA-256 checksum.

            Beta for pilot users: features and behavior may change.
            Review the playbook and target devices before execution.
        run: |
          gh release create "$TAG_NAME" \
            dist/radkit-playbooks.zip dist/SHA256SUMS \
            --verify-tag --draft \
            --title "RADKit Playbooks $TAG_NAME" \
            --notes "$RELEASE_NOTES"
